name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SESSION_SECRET: ci-session-secret-not-used-at-runtime
      DATABASE_URL: postgres://cast:cast@localhost:5432/cast
      REDIS_URL: redis://localhost:6379
      PROVIDER_MODE: stub
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
