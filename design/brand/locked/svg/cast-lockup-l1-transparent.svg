<svg xmlns="http://www.w3.org/2000/svg" width="280" height="40" viewBox="0 0 280 40" role="img" aria-label="Cast L1 lockup">
  <!-- Mid-line y=20. Mark geometric center on mid-line.
       CAST uses dominant-baseline=central then dy=0.06em so CAPS optical center hits mid-line
       (em-box central sits below CAPS visual mid). -->
  <g transform="translate(20,20)">
    <rect x="-16" y="-11" width="32" height="22" rx="2.5" fill="none" stroke="#C4A574" stroke-width="1.85"/>
    <rect x="-6.5" y="-1.15" width="13" height="2.3" rx="1.15" fill="#C4A574"/>
  </g>
  <text x="48" y="20" dy="0.06em" dominant-baseline="central" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="500" letter-spacing="0.16em" fill="#F4F1EA">CAST</text>
</svg>
