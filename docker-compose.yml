services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cast
      POSTGRES_PASSWORD: cast
      POSTGRES_DB: cast
    ports:
      - "5432:5432"
    volumes:
      - cast_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - cast_redis:/data

volumes:
  cast_pg:
  cast_redis:
